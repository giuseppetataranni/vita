name = "vita-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Nessun registro permanente delle richieste
[observability]
enabled = false

# Valori NON segreti (possono stare su GitHub). I segreti si caricano con "wrangler secret put".
[vars]
ALLOWED_ORIGIN = "https://giuseppetataranni.github.io"
VAPID_SUBJECT = "https://giuseppetataranni.github.io/vita/"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STORE"
id = "84e86a28bcd8474282455f9e4ba7d0d5"
